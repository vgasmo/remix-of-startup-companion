<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Prevent stale JS bundles: force revalidation on every navigation -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Apply the saved theme before first paint (ThemeProvider only runs after the locale bundle loads) -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        var dark = t === 'dark' || ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch (e) {}
    </script>
    <title>Startup Leiria Portal | Plataforma de Mentoria para Startups</title>
    <meta name="description" content="Plataforma de acompanhamento e mentoria de startups. Gestão de sessões, KPIs, milestones e integração com Microsoft Teams." />
    <meta name="author" content="Startup Leiria" />
    <meta name="keywords" content="startup, mentoria, aceleradora, incubadora, leiria, portugal, empreendedorismo" />
    <link rel="canonical" href="https://startupleiria.app" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#c82333" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SL Portal" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Startup Leiria Portal" />
    <meta property="og:description" content="Plataforma de acompanhamento e mentoria de startups. Gestão de sessões, KPIs e integração com Microsoft Teams." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://startupleiria.app" />
    <meta property="og:image" content="https://startupleiria.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="640" />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:site_name" content="Startup Leiria" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@StartupLeiria" />
    <meta name="twitter:title" content="Startup Leiria Portal" />
    <meta name="twitter:description" content="Plataforma de acompanhamento e mentoria de startups" />
    <meta name="twitter:image" content="https://startupleiria.app/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Preload LCP image (login logo) for faster first paint -->
    <link rel="preload" href="/src/assets/startup-leiria.svg" as="image" type="image/svg+xml" fetchpriority="high" />

    <!-- Preconnect to backend API to reduce first-request latency -->
    <link rel="preconnect" href="https://apxzuslwhjujgrcsfzqw.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://apxzuslwhjujgrcsfzqw.supabase.co" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
