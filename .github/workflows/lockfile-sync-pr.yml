name: "Bun lockfile validation"

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'

jobs:
  validate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Validate lockfile consistency (bun install --frozen-lockfile)
        run: bun install --frozen-lockfile

      - name: Validate build under Bun
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key-for-build
          VITE_SUPABASE_PROJECT_ID: example
