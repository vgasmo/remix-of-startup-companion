name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Gate 1: Lint + Typecheck + Build
  # ──────────────────────────────────────────────
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type Check
        run: bunx tsc --noEmit -p tsconfig.typecheck.json

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key-for-build
          VITE_SUPABASE_PROJECT_ID: example

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          echo "✅ Build successful"

      - name: Bundle size budget (900 KB gzip initial JS)
        run: bunx size-limit
        continue-on-error: false

  # ──────────────────────────────────────────────
  # Gate 2: Vitest unit/integration tests
  # ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Vitest unit tests
        run: bunx vitest run --reporter=verbose
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key-for-build
          VITE_SUPABASE_PROJECT_ID: example

  # ──────────────────────────────────────────────
  # Gate 5: i18n key parity (EN ↔ PT)
  # ──────────────────────────────────────────────
  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: i18n key parity check
        run: node scripts/i18n-check.cjs

  # ──────────────────────────────────────────────
  # Gate: i18n lint (duplicates, EN-in-PT, missing keys)
  # ──────────────────────────────────────────────
  i18n-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: i18n sync (populate missing keys)
        run: node scripts/i18n-sync.cjs

      - name: i18n lint (strict)
        run: node scripts/i18n-lint.mjs

      - name: i18n semantic quality (PT-PT leakage / placeholders)
        run: node scripts/rc5/i18n-quality.mjs

  # ──────────────────────────────────────────────
  # Gate: i18n sync must be committed (no drift)
  # ──────────────────────────────────────────────
  i18n-sync-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run i18n sync
        run: node scripts/i18n-sync.cjs

      - name: Verify no changes after sync (fail-on-drift)
        run: |
          if ! git diff --exit-code src/i18n/locales; then
            echo "❌ i18n sync produced uncommitted changes!"
            echo "📋 Diff (first 60 lines):"
            git diff src/i18n/locales | head -60
            echo ""
            echo "Fix: run 'node scripts/i18n-sync.cjs' locally and commit the result."
            exit 1
          fi
          echo "✅ i18n locales are in sync"

  # ──────────────────────────────────────────────
  # Gate: .env leak guard
  # ──────────────────────────────────────────────
  env-leak-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if real .env is committed
        run: |
          if [ -f ".env" ]; then
            echo "❌ SECURITY: .env file detected in repository!"
            echo "Real environment files must never be committed."
            exit 1
          fi
          # Check for other .env variants (but allow .env.example)
          ENV_FILES=$(find . -maxdepth 1 -name '.env.*' ! -name '.env.example' -type f 2>/dev/null)
          if [ -n "$ENV_FILES" ]; then
            echo "❌ SECURITY: Environment files detected in repository:"
            echo "$ENV_FILES"
            exit 1
          fi
          echo "✅ No .env secrets in repository"

  # ──────────────────────────────────────────────
  # Gate: Secret leak scan
  # ──────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan for hardcoded secrets
        run: node scripts/secret-scan.cjs

  # ──────────────────────────────────────────────
  # Gate: A4 — person-specific data ops in migrations
  # ──────────────────────────────────────────────
  migration-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan migrations for person-specific data operations
        run: node scripts/ci/scan-migrations.mjs

  # ──────────────────────────────────────────────
  # Gate H: Deno check for changed edge functions
  # ──────────────────────────────────────────────
  deno-check-edge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install edge function dependencies (deterministic)
        run: deno install
        working-directory: supabase/functions

      - name: Deno check ALL edge TypeScript files (full tree)
        run: node scripts/rc5/deno-check-all.mjs



  # ──────────────────────────────────────────────
  # Gates 3, 7, 8, 9: Playwright E2E tests
  # Uses local Supabase — no secrets required
  # ──────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-build
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration integrity (no dynamic prereqs)
        run: |
          if ls supabase/migrations/*prereq* 2>/dev/null; then
            echo "❌ Found prereq migration files in source — migrations must be self-contained."
            echo "If tables are missing, add a proper migration to the source."
            exit 1
          fi
          echo "✅ No ad-hoc prereq migrations found"

      - name: Start local Supabase
        run: supabase start

      - name: Get Supabase status
        id: supabase
        run: |
          # Extract values from supabase status
          API_URL=$(supabase status --output json | jq -r '.API_URL // empty' 2>/dev/null || supabase status | grep 'API URL' | awk '{print $NF}')
          ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY // empty' 2>/dev/null || supabase status | grep 'anon key' | awk '{print $NF}')
          SERVICE_ROLE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY // empty' 2>/dev/null || supabase status | grep 'service_role key' | awk '{print $NF}')

          # Fallback defaults for local supabase
          API_URL=${API_URL:-http://127.0.0.1:54321}
          ANON_KEY=${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
          SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}

          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "anon_key=$ANON_KEY" >> $GITHUB_OUTPUT
          echo "service_role_key=$SERVICE_ROLE_KEY" >> $GITHUB_OUTPUT
          echo "✅ Supabase local: $API_URL"

      - name: Seed test data
        run: bunx tsx scripts/e2e/seed-local-supabase.ts
        env:
          SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
          SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}

      - name: Build app for E2E
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.anon_key }}
          VITE_SUPABASE_PROJECT_ID: local

      - name: Start preview server
        run: bunx vite preview --port 5173 &
        env:
          NODE_ENV: production

      - name: Wait for server
        run: bunx wait-on http://localhost:5173 --timeout 15000

      - name: Run Playwright tests
        run: bunx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Gate 4: pgTAP database tests
  # ──────────────────────────────────────────────
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.ENABLE_DB_TESTS == 'true' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration integrity (no dynamic prereqs)
        run: |
          if ls supabase/migrations/*prereq* 2>/dev/null; then
            echo "❌ Found prereq migration files in source — migrations must be self-contained."
            exit 1
          fi
          echo "✅ No ad-hoc prereq migrations found"

      - name: Start local Supabase (applies all migrations)
        run: supabase start

      - name: Verify migrations applied
        run: supabase migration list --local

      - name: Lint database schema
        run: supabase db lint

      - name: Run pgTAP tests
        run: supabase test db
